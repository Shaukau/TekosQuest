<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#13233a">
  <title>Tekos Quest Engine</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="/_vercel/insights/script.js"></script>
  <script>
    window.si = window.si || function () {
      (window.siq = window.siq || []).push(arguments);
    };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <main id="game-shell">
    <header id="topbar">
      <div>
        <strong>TEKOS QUEST ENGINE</strong>
        <small id="engine-version">Phaser · moteur modulaire</small>
      </div>
      <nav>
        <button id="btn-journal">Journal</button>
        <button id="btn-save">Sauvegarder</button>
        <button id="btn-reset">Nouvelle partie</button>
      </nav>
    </header>

    <section id="game-layout">
      <div id="game-container"></div>
      <aside id="hud-panel">
        <div class="hud-card">
          <h2 id="player-name">Tekos</h2>
          <p>Niveau <strong id="player-level">1</strong></p>
          <div class="bar"><span id="xp-bar"></span></div>
          <p><span id="xp-value">0</span> XP · <span id="credits-value">250</span> crédits</p>
        </div>

        <div class="hud-card objective">
          <h3>Objectif actuel</h3>
          <p id="objective-title">Commencer le premier jour</p>
          <small id="objective-detail">Quitte ta maison et rends-toi à Tekos Tech.</small>
        </div>

        <div class="hud-card controls">
          <h3>Commandes</h3>
          <p>Flèches / ZQSD : déplacement</p>
          <p>Espace / Entrée : interaction</p>
        </div>
      </aside>
    </section>
  </main>

  <div id="dialogue" class="overlay hidden" aria-hidden="true">
    <section class="window">
      <header>
        <div>
          <h2 id="dialogue-title">Dialogue</h2>
          <small id="dialogue-subtitle"></small>
        </div>
        <button id="dialogue-close" aria-label="Fermer">×</button>
      </header>
      <div id="dialogue-content"></div>
      <footer id="dialogue-actions"></footer>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
